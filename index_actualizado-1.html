<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff7b2">
  <title>Para Ari 🌼</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 20%, rgba(255,255,255,.9), transparent 35%),
        linear-gradient(180deg, #fffbe1 0%, #fff4a8 48%, #e7f5cf 100%);
      color: #514719;
    }

    .scene {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 100px;
      overflow: hidden;
    }

    .sun {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: rgba(255, 218, 69, .25);
      filter: blur(5px);
      top: -80px;
      right: -70px;
    }

    .card {
      position: relative;
      z-index: 5;
      width: min(92vw, 650px);
      padding: 46px 30px 42px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.75);
      border-radius: 32px;
      background: rgba(255,255,255,.48);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(116, 96, 15, .18);
      animation: appear 1.3s ease both;
    }

    /* Aparición suave al abrir */
    .small, h1, .subtitle, button, .hint {
      opacity: 0;
      animation: textIn .9s ease forwards;
    }
    .small { animation-delay: 2.4s; }
    h1 { animation-delay: 2.7s; }
    .subtitle { animation-delay: 3s; }
    button { animation-delay: 3.25s; }
    .hint { animation-delay: 3.45s; }

    .small {
      letter-spacing: 4px;
      text-transform: uppercase;
      font-size: 12px;
      color: #8d7a1d;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 10vw, 76px);
      line-height: .95;
      color: #d39b00;
      text-shadow: 0 2px 0 rgba(255,255,255,.8);
    }

    .subtitle {
      margin: 20px auto 0;
      max-width: 480px;
      font-size: clamp(17px, 4vw, 21px);
      line-height: 1.65;
      color: #665a25;
    }

    .bouquet {
      position: relative;
      width: 300px;
      height: 250px;
      margin: 0 auto 6px;
    }

    .stem {
      position: absolute;
      width: 5px;
      height: 155px;
      background: linear-gradient(#5f8d3a, #416c31);
      left: 50%;
      top: 85px;
      border-radius: 99px;
      transform-origin: top;
    }

    .stem.s1 { transform: rotate(-24deg); height: 145px; }
    .stem.s2 { transform: rotate(-9deg); height: 160px; }
    .stem.s3 { transform: rotate(12deg); height: 155px; }
    .stem.s4 { transform: rotate(27deg); height: 140px; }

    .leaf {
      position: absolute;
      width: 42px;
      height: 19px;
      background: #609342;
      border-radius: 100% 0 100% 0;
      transform-origin: 0 50%;
    }

    .leaf.l1 { left: 82px; top: 145px; transform: rotate(20deg); }
    .leaf.l2 { left: 191px; top: 133px; transform: rotate(160deg); }
    .leaf.l3 { left: 116px; top: 177px; transform: rotate(10deg); }

    .flower {
      position: absolute;
      width: 92px;
      height: 92px;
      left: 50%;
      top: 18px;
      transform: translateX(-50%) scale(0);
      opacity: 0;
      animation: flowerIn 1s cubic-bezier(.2,.8,.2,1) forwards, sway 4s ease-in-out 3.4s infinite;
    }

    .flower.f2 { left: 29%; top: 43px; animation-delay: .55s, 3.4s; }
    .flower.f3 { left: 71%; top: 42px; animation-delay: 1s, 3.7s; }
    .flower.f4 { left: 42%; top: 5px; animation-delay: 1.45s, 4s; }
    .flower:not(.f2):not(.f3):not(.f4) { animation-delay: 1.9s, 4.3s; }

    .petal {
      position: absolute;
      width: 32px;
      height: 48px;
      left: 30px;
      top: 22px;
      background: #ffd72f;
      border-radius: 55% 55% 48% 48%;
      transform-origin: 16px 24px;
      box-shadow: 0 2px 5px rgba(183, 133, 0, .13);
    }

    .p1 { transform: rotate(0deg) translateY(-27px); }
    .p2 { transform: rotate(45deg) translateY(-27px); }
    .p3 { transform: rotate(90deg) translateY(-27px); }
    .p4 { transform: rotate(135deg) translateY(-27px); }
    .p5 { transform: rotate(180deg) translateY(-27px); }
    .p6 { transform: rotate(225deg) translateY(-27px); }
    .p7 { transform: rotate(270deg) translateY(-27px); }
    .p8 { transform: rotate(315deg) translateY(-27px); }

    .center {
      position: absolute;
      width: 30px;
      height: 30px;
      left: 31px;
      top: 31px;
      border-radius: 50%;
      background: radial-gradient(circle, #5d4213 0 18%, #9d6812 20% 48%, #704b0d 50% 100%);
      box-shadow: 0 0 0 5px rgba(255,210,30,.3);
    }

    button {
      margin-top: 25px;
      border: 0;
      border-radius: 999px;
      padding: 13px 22px;
      background: #e5b900;
      color: white;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(176, 130, 0, .25);
      transition: transform .2s, background .2s;
    }

    button:hover { transform: translateY(-2px); background: #d4aa00; }
    button:active { transform: scale(.97); }

    .hint {
      margin-top: 13px;
      font-size: 12px;
      color: #8b7a38;
    }

    .petals {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      overflow: hidden;
    }

    .falling {
      position: absolute;
      top: -30px;
      width: 12px;
      height: 18px;
      background: #ffd83d;
      border-radius: 70% 30% 70% 30%;
      opacity: .75;
      animation: fall linear forwards;
    }

    .ground {
      position: absolute;
      bottom: -100px;
      left: -5%;
      width: 110%;
      height: 180px;
      background: #8eb66b;
      border-radius: 50% 50% 0 0;
      opacity: .55;
    }

    @keyframes flowerIn {
      0% { opacity: 0; transform: translateX(-50%) scale(0); }
      70% { opacity: 1; transform: translateX(-50%) scale(1.08); }
      100% { opacity: 1; transform: translateX(-50%) scale(1); }
    }

    @keyframes textIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fall {
      to {
        transform: translate3d(var(--drift), 110vh, 0) rotate(540deg);
      }
    }

    @keyframes sway {
      0%,100% { rotate: -2deg; }
      50% { rotate: 2deg; }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(25px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    @media (max-width: 500px) {
      .card { padding: 34px 18px 32px; }
      .bouquet { transform: scale(.85); margin-top: -5px; margin-bottom: -20px; }
      .subtitle { line-height: 1.5; }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene">
    <div class="sun"></div>
    <div class="petals" id="petals"></div>

    <section class="card">
      <div class="bouquet" aria-label="Ramo de gerberas amarillas">
        <div class="stem s1"></div>
        <div class="stem s2"></div>
        <div class="stem s3"></div>
        <div class="stem s4"></div>

        <div class="leaf l1"></div>
        <div class="leaf l2"></div>
        <div class="leaf l3"></div>

        <div class="flower f2">
          <i class="petal p1"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i>
          <i class="petal p5"></i><i class="petal p6"></i><i class="petal p7"></i><i class="petal p8"></i>
          <i class="center"></i>
        </div>

        <div class="flower f3">
          <i class="petal p1"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i>
          <i class="petal p5"></i><i class="petal p6"></i><i class="petal p7"></i><i class="petal p8"></i>
          <i class="center"></i>
        </div>

        <div class="flower f4">
          <i class="petal p1"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i>
          <i class="petal p5"></i><i class="petal p6"></i><i class="petal p7"></i><i class="petal p8"></i>
          <i class="center"></i>
        </div>

        <div class="flower">
          <i class="petal p1"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i>
          <i class="petal p5"></i><i class="petal p6"></i><i class="petal p7"></i><i class="petal p8"></i>
          <i class="center"></i>
        </div>
      </div>

      <div class="small">21 de septiembre</div>
      <h1>Feliz día muñeca 🤍</h1>

      <p class="subtitle">
        Un pequeño detalle para alegrarte el día.<br>
        Espero que estas flores te saquen una sonrisa. 💛
      </p>

      <button id="moreFlowers">Un poquito más de flores 🌻</button>
      <div class="hint">Toca el botón ✨</div>
    </section>

    <div class="ground"></div>
  </main>

  <script>
    const petals = document.getElementById("petals");
    const button = document.getElementById("moreFlowers");

    function createPetal() {
      const p = document.createElement("span");
      p.className = "falling";
      p.style.left = Math.random() * 100 + "vw";
      p.style.setProperty("--drift", (Math.random() * 180 - 90) + "px");
      p.style.animationDuration = (5 + Math.random() * 5) + "s";
      p.style.animationDelay = (Math.random() * 1.5) + "s";
      p.style.transform = `rotate(${Math.random() * 360}deg) scale(${.65 + Math.random() * .7})`;
      petals.appendChild(p);
      setTimeout(() => p.remove(), 12000);
    }

    // Lluvia suave de pétalos al abrir.
    for (let i = 0; i < 18; i++) createPetal();

    button.addEventListener("click", () => {
      for (let i = 0; i < 35; i++) createPetal();
      button.textContent = "Para ti 💛";
    });
  </script>
</body>
</html>
